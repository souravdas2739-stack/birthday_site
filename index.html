<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1b4b; --ink2:#2b2870; --pink:#ff5d8f; --lemon:#ffd85e; --mint:#7be0c3; --paper:#fff8f3;
    --display:"Bagel Fat One","Trebuchet MS",system-ui,sans-serif;
    --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:linear-gradient(160deg,#2b2870,#1d1b4b 55%,#2a1b55);background-attachment:fixed;color:var(--paper);font-family:var(--body);
    overflow:hidden;-webkit-tap-highlight-color:transparent}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  :focus-visible{outline:3px solid var(--lemon);outline-offset:4px}

  /* ---------- ambient background ---------- */
  .bunting{position:fixed;top:0;left:0;right:0;height:56px;display:flex;justify-content:space-around;pointer-events:none;z-index:3;
    transform:translateY(-70px);animation:bunt 1.4s var(--ease) .2s forwards}
  @keyframes bunt{to{transform:none}}
  .bunting i{width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:40px solid var(--pink);
    transform-origin:top center;animation:sway 3.2s ease-in-out infinite alternate}
  .bunting i:nth-child(3n+2){border-top-color:var(--lemon);animation-delay:-1s}
  .bunting i:nth-child(3n){border-top-color:var(--mint);animation-delay:-2s}
  @keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
  .bgballoons{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .bgb{position:absolute;bottom:-140px;width:var(--s);height:calc(var(--s) * 1.25);border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
    background:var(--c);opacity:.25;animation:rise var(--t) linear var(--dl) infinite}
  .bgb::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:46px;background:rgba(255,255,255,.35)}
  @keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(18px,-30vh)}50%{transform:translate(-14px,-65vh)}75%{transform:translate(16px,-100vh)}100%{transform:translate(0,-135vh)}}

  /* ---------- scenes (smooth cross-fade) ---------- */
  .scene{position:fixed;inset:0;z-index:1;display:flex;overflow-y:auto;padding:84px 22px 56px;text-align:center;
    opacity:0;visibility:hidden;transform:scale(1.05);filter:blur(10px);
    transition:opacity .9s var(--ease),transform 1.1s var(--ease),filter .9s var(--ease),visibility 0s linear .9s}
  .scene.on{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
  .inner{margin:auto;display:flex;flex-direction:column;align-items:center}
  .inner.stack{margin:0 auto;align-self:stretch;width:100%;max-width:480px;justify-content:space-between;gap:22px}

  h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08}
  h1{font-size:clamp(2.2rem,9vw,3.8rem);color:var(--lemon);text-shadow:4px 4px 0 var(--pink);max-width:15ch}
  h1.intro{font-size:clamp(1.9rem,7.6vw,2.9rem);max-width:17ch}
  h2{font-size:clamp(1.9rem,7.5vw,3rem);color:var(--lemon)}
  .hint{margin-top:22px;min-height:1.6em;font-weight:700;font-size:1.05rem}

  /* ---------- text animation ---------- */
  .nw{display:inline-block;white-space:nowrap}
  .w{display:inline-block;opacity:0;transform:translateY(.7em) scale(.96);filter:blur(7px);
    transition:opacity .8s var(--ease),transform .9s var(--ease),filter .8s var(--ease);transition-delay:var(--d,0ms)}
  .go .w{opacity:1;transform:none;filter:none}

  /* ---------- buttons ---------- */
  .btn{background:var(--pink);color:#fff;font-weight:800;font-size:1.1rem;padding:14px 34px;border-radius:999px;
    box-shadow:0 6px 0 #b8325e;transition:transform .1s,box-shadow .1s}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b8325e}
  .btn.alt{background:var(--mint);color:var(--ink);box-shadow:0 6px 0 #3fa68a}
  .btn.alt:active{box-shadow:0 1px 0 #3fa68a}
  .row{display:flex;gap:18px;justify-content:center;align-items:center}

  /* ---------- INTRO: split-screen windows ---------- */
  .split{position:relative;display:flex;gap:22px;justify-content:center;width:100%}
  .win{position:relative;width:min(38vw,170px);aspect-ratio:3/4;border-radius:999px 999px 12px 12px;overflow:hidden;border:7px solid var(--paper);
    box-shadow:0 14px 30px rgba(0,0,0,.35),0 8px 0 rgba(255,255,255,.16);opacity:0;transition:opacity 1.1s var(--ease),transform 1.4s var(--ease)}
  .win-l{transform:translateX(-60px)} .win-r{transform:translateX(60px)}
  .scene.on .win{opacity:1;transform:none;transition-delay:1s}
  .sky{position:absolute;inset:0}
  .win-l .sky{background:linear-gradient(#4aa9ff,#d4f0ff)}
  .win-r .sky{background:linear-gradient(#ff8fa3,#ffc98f 55%,#ffeacb)}
  .cloud{position:absolute;left:-70px;top:var(--y);width:54px;height:16px;border-radius:16px;background:rgba(255,255,255,.92);
    animation:drift var(--t) linear var(--dl) infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:26px;height:26px;left:7px;top:-12px}
  .cloud::after{width:20px;height:20px;left:26px;top:-8px}
  @keyframes drift{to{transform:translateX(340px)}}
  .avatar{position:absolute;left:0;right:0;bottom:-6px;font-size:92px;line-height:1}
  .win img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .win.has img{display:block} .win.has .avatar{display:none}
  .bars{position:absolute;inset:0;pointer-events:none}
  .bars::before,.bars::after{content:"";position:absolute;background:rgba(255,248,243,.92)}
  .bars::before{left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px}
  .bars::after{left:0;right:0;top:56%;height:5px}
  .mid-heart{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:30px;z-index:2;animation:beat 1.4s ease-in-out infinite}
  @keyframes beat{50%{transform:translate(-50%,-50%) scale(1.3)}}

  .ask{display:flex;flex-direction:column;align-items:center;gap:20px}
  .ask-text{font-family:var(--display);font-size:clamp(1.4rem,5.6vw,1.9rem);color:var(--lemon);max-width:18ch;line-height:1.15}
  .ask .row{opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
  .scene.on .ask .row{opacity:1;transform:none;transition-delay:2.8s}
  .no-slot{display:inline-block}
  .no-btn.fly{position:fixed;z-index:8;transition:left .55s var(--ease),top .55s var(--ease),opacity .5s}
  .no-btn.gone{opacity:0;pointer-events:none}

  /* ---------- modals ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,8,40,.72);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
  .modal.on{opacity:1;visibility:visible;transition-delay:0s}
  .dialog{background:var(--paper);color:var(--ink);width:min(340px,100%);padding:30px 24px 26px;border-radius:18px;text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.5);transform:translateY(30px) scale(.8);transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
  .modal.on .dialog{transform:none}
  .dialog h3{font-size:1.7rem;color:var(--pink);margin-bottom:20px}
  .puppy{font-size:84px;line-height:1;margin-bottom:10px;animation:wob 1.8s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.1)}}

  /* ---------- BALLOON PAGE ---------- */
  .sentence{display:flex;gap:.3em .4em;flex-wrap:wrap;justify-content:center;min-height:1.3em;margin:6px 0 30px;
    font-family:var(--display);font-size:clamp(2.1rem,10vw,3.6rem);color:var(--lemon);text-shadow:3px 3px 0 var(--pink)}
  .sentence span{display:inline-block;opacity:0;transform:translateY(34px) scale(.6);filter:blur(10px);
    transition:opacity .7s var(--ease),transform .9s cubic-bezier(.3,1.6,.5,1),filter .7s var(--ease)}
  .sentence span.show{opacity:1;transform:none;filter:none}
  .bal-row{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;max-width:400px}
  .bl{position:relative;width:78px;height:136px;opacity:0;transform:translateY(160px);transition:opacity .9s var(--ease),transform 1.4s var(--ease)}
  .scene.on .bl{opacity:1;transform:none;transition-delay:calc(var(--i) * 160ms + 700ms)}
  .bl:nth-child(even){margin-top:26px}
  .bl-in{display:flex;flex-direction:column;align-items:center;animation:blsway 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.8s);transform-origin:50% 100%}
  @keyframes blsway{50%{transform:translateY(-10px) rotate(3deg)}}
  .bl-body{position:relative;width:74px;height:92px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;display:grid;place-items:center;
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7) 0 8%,transparent 22%),var(--c);box-shadow:inset -8px -10px 16px rgba(0,0,0,.18);
    font-family:var(--display);font-size:1.5rem;color:rgba(255,255,255,.9)}
  .bl-knot{width:12px;height:10px;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);margin-top:-1px}
  .bl-str{width:2px;height:34px;background:rgba(255,255,255,.45)}
  .bl.next .bl-body{animation:nextpulse 1.4s ease-in-out infinite}
  @keyframes nextpulse{0%,100%{box-shadow:inset -8px -10px 16px rgba(0,0,0,.18),0 0 0 0 rgba(255,216,94,.7)}50%{box-shadow:inset -8px -10px 16px rgba(0,0,0,.18),0 0 0 12px rgba(255,216,94,0)}}
  .bl.shake .bl-in{animation:shake .4s ease}
  @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .bl.popped{pointer-events:none}
  .bl.popped .bl-in{animation:none;opacity:0;transform:scale(1.7);transition:transform .22s ease-out,opacity .22s ease-out}
  .spark{position:fixed;width:9px;height:9px;margin:-4px;border-radius:50%;z-index:50;pointer-events:none;animation:spark .75s ease-out forwards}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

  /* ---------- cake ---------- */
  .cake{position:relative;width:min(260px,70vw);margin-top:38px;opacity:0;transform:translateY(50px) scale(.9);
    transition:opacity 1s var(--ease) .5s,transform 1.2s var(--ease) .5s}
  .scene.on .cake{opacity:1;transform:none}
  .halo{position:absolute;left:50%;top:-30px;width:300px;height:300px;margin-left:-150px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,200,90,.38),transparent 65%);transition:opacity 1.3s ease;pointer-events:none}
  .out .halo{opacity:0}
  .candle-btn{display:block;margin:0 auto;position:relative;padding:0 24px;border-radius:12px}
  .candles{display:flex;justify-content:center;gap:24px;padding-top:34px}
  .candle{position:relative;width:14px;height:56px;background:repeating-linear-gradient(45deg,var(--mint) 0 8px,#fff 8px 16px);border-radius:3px}
  .flame{position:absolute;left:50%;top:-30px;width:20px;height:30px;margin-left:-10px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
    background:radial-gradient(circle at 50% 70%,#fff 0 20%,var(--lemon) 45%,#ff9f43);transform-origin:bottom center;
    animation:flick .25s infinite alternate;box-shadow:0 0 26px 8px rgba(255,200,80,.5);transition:opacity .35s ease,transform .35s ease,box-shadow .35s}
  @keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.08) rotate(3deg)}}
  .blowing .flame{animation:none;transform:rotate(38deg) scale(.85,.7) translateX(5px)}
  .out .flame{animation:none;opacity:0;transform:rotate(60deg) scale(.1);box-shadow:none}
  .smoke{position:absolute;left:50%;top:-22px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:rgba(255,255,255,.6);opacity:0}
  .out .smoke{animation:puff 2s ease-out forwards}
  .out .smoke:nth-of-type(3){animation-delay:.25s}
  .out .smoke:nth-of-type(4){animation-delay:.5s}
  @keyframes puff{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(18px,-100px) scale(6)}}
  .ring{position:absolute;left:50%;top:0;width:76px;height:76px;margin-left:-38px;border-radius:50%;border:3px solid var(--lemon);
    animation:ring 1.8s ease-out infinite;pointer-events:none}
  .blowing .ring,.out .ring{display:none}
  @keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.4);opacity:0}}
  .tier{margin:0 auto;border-radius:14px 14px 8px 8px;position:relative}
  .t1{width:62%;height:56px;background:var(--pink)}
  .t2{width:100%;height:76px;background:var(--lemon);margin-top:-4px}
  .t1::after,.t2::after{content:"";position:absolute;left:0;right:0;top:0;height:16px;border-radius:14px 14px 0 0;
    background:radial-gradient(circle at 12px 0,#fff 11px,transparent 12px) 0 0/24px 16px repeat-x}
  .plate{width:118%;height:14px;margin:-2px -9% 0;background:var(--paper);border-radius:50%;box-shadow:0 8px 0 rgba(0,0,0,.2)}

  /* ---------- gift + card ---------- */
  .choices{display:flex;flex-wrap:wrap;gap:38px 50px;justify-content:center;align-items:flex-end;margin-top:36px}
  .choice{display:flex;flex-direction:column;align-items:center;gap:16px;font-weight:800;font-size:1.05rem;
    opacity:0;transform:translateY(70px) scale(.8);transition:opacity 1s var(--ease),transform 1.2s var(--ease)}
  .scene.on .choice{opacity:1;transform:none;transition-delay:1.1s}
  .scene.on .choice:nth-child(2){transition-delay:1.4s}
  .bob{display:block;animation:bob 3.6s ease-in-out infinite}
  .choice:nth-child(2) .bob{animation-delay:-1.8s}
  @keyframes bob{50%{transform:translateY(-9px) rotate(1.5deg)}}
  .gift,.gcard{position:relative;display:block;width:128px;height:128px}
  .gbox{position:absolute;bottom:0;left:6px;right:6px;height:86px;background:var(--pink);border-radius:6px}
  .gbox::after,.glid::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:22px;margin-left:-11px;background:var(--lemon)}
  .glid{position:absolute;left:0;right:0;bottom:80px;height:36px;background:#ff7aa5;border-radius:6px;transform-origin:left bottom;
    transition:transform .8s cubic-bezier(.3,1.5,.5,1);z-index:2}
  .glid::before{content:"";position:absolute;left:50%;top:-22px;width:46px;height:26px;margin-left:-23px;border:7px solid var(--lemon);border-radius:50% 50% 0 0}
  .opened .glid{transform:translate(-22px,-56px) rotate(-28deg)}
  .glow{position:absolute;left:14px;right:14px;top:30px;height:50px;background:radial-gradient(var(--lemon),transparent 70%);opacity:0;transform:scale(.5);
    transition:opacity .6s ease,transform 1s var(--ease)}
  .opened .glow{opacity:1;transform:scale(3)}
  .gcard{display:grid;place-items:center}
  .gcard-body{width:92px;height:122px;background:var(--paper);border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.25);display:grid;place-items:center;
    font-size:44px;transform:rotate(4deg);border-left:10px solid var(--mint)}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;z-index:20;background:rgba(20,18,64,.93);display:flex;overflow-y:auto;padding:22px;
    opacity:0;visibility:hidden;transition:opacity .8s ease,visibility 0s linear .8s}
  .overlay.on{opacity:1;visibility:visible;transition-delay:0s}
  .close{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;width:46px;height:46px;border-radius:50%;background:var(--paper);color:var(--ink);
    font-size:22px;font-weight:800;z-index:25}
  .card{background:var(--paper);color:var(--ink);max-width:460px;width:100%;margin:auto;padding:30px 28px 36px;border-radius:6px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);text-align:left;font-size:1.12rem;line-height:1.7;
    transform:translateY(60px) scale(.88) rotate(-5deg);transition:transform 1.2s var(--ease)}
  .overlay.on .card{transform:rotate(-1deg)}
  .letter-head{display:flex;align-items:center;justify-content:center;gap:10px;padding-bottom:14px;margin-bottom:20px;
    border-bottom:2px dashed rgba(255,93,143,.45);font-family:var(--display);font-size:1.15rem;color:var(--pink)}
  .letter-head .heart{font-size:1.5rem;animation:beat2 1.3s ease-in-out infinite}
  @keyframes beat2{50%{transform:scale(1.3)}}
  .card h2{color:var(--pink);margin-bottom:14px}
  .card .sig{margin-top:20px;font-weight:800;color:var(--ink2)}

  .collage{width:100%;max-width:600px;margin:auto;padding:56px 0 24px;text-align:center;display:flex;flex-direction:column;align-items:center}
  .carousel{position:relative;width:100%;height:clamp(350px,56vh,430px);margin-top:16px;perspective:1100px;touch-action:pan-y;user-select:none;-webkit-user-select:none;
    overflow:hidden;cursor:grab;opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1.2s var(--ease)}
  .overlay.on .carousel{opacity:1;transform:none;transition-delay:.6s}
  .carousel.dragging{cursor:grabbing}
  .slide{position:absolute;left:50%;top:50%;margin:0;width:min(68vw,290px);background:var(--paper);color:var(--ink);padding:10px 10px 14px;
    box-shadow:0 18px 40px rgba(0,0,0,.45);will-change:transform,opacity;
    transition:transform .6s var(--ease),opacity .6s var(--ease),filter .6s var(--ease)}
  .carousel.dragging .slide{transition:none}
  .slide img{display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:center 30%;background:#ddd;pointer-events:none;-webkit-user-drag:none}
  .slide figcaption{font-family:var(--display);font-size:1.05rem;margin-top:10px}
  .arrow{position:absolute;top:50%;z-index:100;width:42px;height:42px;margin-top:-21px;border-radius:50%;background:rgba(255,248,243,.9);color:var(--ink);
    font-size:22px;font-weight:800;line-height:1;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .arrow.prev{left:8px} .arrow.next{right:8px}
  .arrow[disabled]{opacity:.25;pointer-events:none}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:14px;opacity:0;transition:opacity 1s ease 1.2s}
  .overlay.on .dots,.overlay.on .swipe{opacity:1}
  .dot{width:9px;height:9px;padding:0;border-radius:9px;background:rgba(255,255,255,.3);transition:width .4s var(--ease),background .4s}
  .dot.on{width:24px;background:var(--lemon)}
  .swipe{margin-top:14px;font-weight:700;opacity:0;transition:opacity 1s ease 1.4s,visibility 0s}
  .swipe.gone{opacity:0!important;visibility:hidden;transition:opacity .5s}
  .swipe span{display:inline-block;animation:nudgeX 1.4s ease-in-out infinite}
  .swipe span:last-child{animation-direction:reverse}
  @keyframes nudgeX{50%{transform:translateX(-6px)}}

  /* ---------- Next button + FINAL page ---------- */
  .go-next{margin-top:36px;opacity:0;visibility:hidden;transform:translateY(24px);transition:opacity .8s var(--ease),transform 1s var(--ease),visibility 0s linear .8s,box-shadow .1s}
  .go-next.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
  .go-next.show:active{transform:translateY(5px)}
  .choice.done > span:last-child::after{content:" ✓";color:var(--mint)}
  .scene.light{background:linear-gradient(180deg,#fff6f8,#ffe0ea)}
  .sticker-card{position:relative;width:min(58vw,230px);aspect-ratio:1;background:#fff;border-radius:26px;display:grid;place-items:center;
    box-shadow:0 18px 44px rgba(255,93,143,.28);transform:scale(.6) translateY(30px);opacity:0;
    transition:transform 1.3s cubic-bezier(.3,1.5,.5,1) .5s,opacity .8s ease .5s}
  .scene.on .sticker-card{transform:none;opacity:1}
  .sticker-card img{width:80%;height:80%;object-fit:contain;display:none}
  .sticker-card.has img{display:block} .sticker-card.has .sticker-fallback{display:none}
  .sticker-fallback{position:relative;width:80%;height:80%;display:grid;place-items:center}
  .hbd{position:absolute;top:0;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:1.7rem;color:#ff7ab0;letter-spacing:2px;
    text-shadow:2px 2px 0 #ffd0e2;animation:hbd 1.6s ease-in-out infinite}
  @keyframes hbd{50%{transform:translateX(-50%) translateY(-5px) rotate(-3deg)}}
  .bear{font-size:100px;line-height:1;margin-top:26px;animation:bob 3.2s ease-in-out infinite}
  .gift2{position:absolute;right:2%;bottom:6%;font-size:46px;animation:bob 3.2s ease-in-out -1.2s infinite}
  .heart-badge{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff8fb3,#ff4f86);
    color:#fff;font-size:20px;box-shadow:0 6px 16px rgba(255,79,134,.5);animation:beat3 1.5s ease-in-out infinite}
  @keyframes beat3{50%{transform:scale(1.15)}}
  .fl1{font-family:"Caveat","Segoe Script",cursive;font-size:clamp(1.9rem,8.4vw,2.4rem);color:#ff5d8f;margin-top:36px}
  .fl2{margin-top:6px;font-weight:800;font-style:italic;color:#8b6b86;font-size:1.02rem}
  .hrt{position:fixed;bottom:-30px;z-index:2;color:#ff8fb3;pointer-events:none;opacity:0;animation:hrise var(--t) ease-in forwards}
  @keyframes hrise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translate(var(--dx),-112vh) scale(1.1);opacity:0}}
  .hpop{position:fixed;z-index:50;margin:-8px;color:#ff4f86;pointer-events:none;animation:hpop 1.1s ease-out forwards}
  @keyframes hpop{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}

  .music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:48px;height:48px;border-radius:50%;
    background:var(--paper);color:var(--ink);font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:opacity .6s}
  .music.show{opacity:1;visibility:visible}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

  @media (prefers-reduced-motion:reduce){
    .bgballoons{display:none}
    .bunting i,.flame,.ring,.bob,.fl,.cloud,.bl-in,.mid-heart,.puppy{animation:none}
    .w,.scene,.choice,.polaroid,.card,.cake,.win,.bl,.ask .row{transition-duration:.01s!important;transition-delay:0s!important}
  }
</style>
</head>
<body>

</div>

</div>

<script>
/* =====================================================
   EDIT THIS PART: text, photos and music
   - Every word is auto-capitalised (Title Case), EXCEPT cardMessage.
   - Files go in the "assets" folder next to index.html
   ===================================================== */
const CONFIG = {
  /* Page 1: intro */
  introTitle: "For The Person Who Makes Distance Small",
  boyImage: "assets/images/boy.jpg",
  girlImage: "assets/images/girl.jpg",
  introQuestion: "Are You Excited For What's Next?",
  yesLabel: "Yes",
  noLabel: "No",
  sureTitle: "Are You Sure?",
  sureYes: "Yes",
  sureNo: "No",
  heartTitle: "But It's From My Heart",
  heartEmoji: "🥺",
  heartYes: "Yes",

  /* Page 2: balloons (4 words, popped in order) */
  balloonHint: "Pop The Balloons In Order",
  balloonWords: ["You", "Are", "So", "Special"],
  continueHint: "Tap Anywhere To Continue",

  /* Page 3: cake */
  wishText: "Firstly, Happy Birthday! Make A Wish.",
  tapHint: "Tap The Candle To Blow It Out",
  afterBlowText: "Wish Made! 🎉",
  candles: 1,

  /* Page 4: gift + card */
  pickTitle: "I Made Something For You.",
  pickHint: "Choose One",
  cardLabel: "Open The Card",
  giftLabel: "Open The Gift",

  nextLabel: "Next ➜",                  // button that appears after the card and gift are both opened

  /* Final page */
  finalImage: "assets/images/sticker.png",   // your teddy/sticker picture (square, transparent PNG works best)
  finalLine1: "Lots Of Love For You ♥",
  finalLine2: "Once Again, Happy Birthday!",

  /* Birthday card */
  letterHeading: "A Letter From My Heart",
  cardTitle: "To My Favourite Person, ❤️",
  cardMessage:                          // (use \n for a new line) - this one is NOT auto-capitalised
    "First of all, happiest birthday, my love!\n\n" +
    "I wish I could put into words just how much you mean to me, but somehow, words never seem enough when it comes to you.\n\n" +
    "You know, sometimes I find myself thinking about how lucky I am to have you in my life. Out of all the people I could have met, somehow our paths crossed, and I got someone who makes ordinary days feel a little more special. Someone I can laugh with, share my thoughts with, be silly around, and make memories with. And honestly, I wouldn't trade that for anything.\n\n" +
    "I know we don't always get to be together the way we'd like to. Distance has its own way of making us miss the little things — the simplest moments, the random conversations, and just being around each other. But if there's one thing I want you to know, it's that distance never makes you any less important to me. If anything, it reminds me how much I look forward to all the moments we still have waiting for us.\n\n" +
    "I made this little surprise because I wanted your birthday to feel a little different. It's not something extravagant, but every little detail comes with a thought of you. I wanted to give you something you could smile at, something that reminds you that there's someone out here who thinks you're pretty special. And yes, I put quite a bit of effort into it, so you're legally required to smile while going through it! ❤️\n\n" +
    "On your birthday, I wish you happiness that never runs out, success in everything you pursue, good health, endless adventures, and all the little things your heart quietly wishes for. I hope you never lose that beautiful smile of yours, never stop believing in yourself, and always remember how wonderful you are.\n\n" +
    "I want to see you grow, achieve everything you've dreamed of, explore new places, experience beautiful things, and create countless memories together. There's still so much life waiting for us, and I hope we get to experience a whole lot of it side by side.\n\n" +
    "And lastly, thank you for being you. Thank you for being a part of my life, for all the memories we've made, and for all the ones we haven't made yet.\n\n" +
    "Happy Birthday once again, my favourite human.\n\n" +
    "No matter how many birthdays come and go, I hope I get to be a part of making each one a little more special.\n\n" +
    "I love you. More than these words could ever explain. ❤️",
  cardSignature: "Yours, Always. ❤️",

  /* Gift collage (images go in assets/images/) */
  collageTitle: "Our Memories",
  swipeHint: "Swipe To See More",
  photos: [
    { src: "1.jpg", caption: "Where The Fun Began" },
    { src: "2.jpg", caption: "Matching Vibes, Matching Smiles" },
    { src: "3.jpg", caption: "Peace, Love And Pure Chaos" },
    { src: "4.jpg", caption: "Caught Mid-Giggle" },
    { src: "5.jpg", caption: "Lost In A Sea Of Balls" },
    { src: "6.jpg", caption: "Just You, Being Effortlessly You" }
  ],

  /* Background music */
  music: "assets/music.mp3",
  musicVolume: 0.6
};
/* ================= END OF EDIT AREA ================= */

const $ = id => document.getElementById(id);
const C = CONFIG;
const wait = ms => new Promise(r => setTimeout(r, ms));
/* Title Case: capitalise the first letter of every word */
const tc = s => String(s == null ? "" : s).replace(/(^|[\s(])([a-z])/g, (m, a, b) => a + b.toUpperCase());

/* ---------- text reveal animation ---------- */
function reveal(el, text, o){
  o = o || {};
  const step = o.step || 80, delay = o.delay || 0, chars = !!o.chars;
  el.textContent = ""; el.classList.remove("go");
  let n = 0;
  const unit = (parent, str) => {
    const s = document.createElement("span"); s.className = "w"; s.textContent = str;
    s.style.setProperty("--d", (delay + n * step) + "ms"); n++; parent.appendChild(s);
  };
  text.split("\n").forEach((line, li) => {
    if (li) el.appendChild(document.createElement("br"));
    line.split(" ").forEach((word, wi, arr) => {
      if (!word) return;
      if (chars){
        const nw = document.createElement("span"); nw.className = "nw";
        Array.from(word).forEach(ch => unit(nw, ch)); el.appendChild(nw);
      } else unit(el, word);
      if (wi < arr.length - 1) el.appendChild(document.createTextNode(" "));
    });
  });
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("go")));
  return delay + n * step + 800;
}
function go(id){ document.querySelectorAll(".scene").forEach(s => s.classList.toggle("on", s.id === id)); }

/* ---------- ambient background ---------- */
const bun = document.querySelector(".bunting");
for(let i=0;i<14;i++) bun.appendChild(document.createElement("i"));
const cols = ["#ff5d8f","#ffd85e","#7be0c3","#8f8bff"];
for(let i=0;i<9;i++){
  const b = document.createElement("span"); b.className = "bgb";
  b.style.cssText = "left:"+(4+i*11)+"%;--s:"+(36+(i*13)%30)+"px;--c:"+cols[i%4]+";--t:"+(16+(i*5)%10)+"s;--dl:-"+((i*3.3)%16)+"s";
  $("bgballoons").appendChild(b);
}

/* ---------- fill static text ---------- */
$("yesBtn").textContent = tc(C.yesLabel); $("noBtn").textContent = tc(C.noLabel);
$("sureTitle").textContent = tc(C.sureTitle); $("sureYes").textContent = tc(C.sureYes); $("sureNo").textContent = tc(C.sureNo);
$("puppy").textContent = C.heartEmoji; $("heartTitle").textContent = tc(C.heartTitle); $("heartYes").textContent = tc(C.heartYes);
$("cardMsg").textContent = C.cardMessage;      // message stays exactly as written
document.title = "Happy Birthday!";

/* ---------- intro windows ---------- */
function makeWindow(side, src, emoji){
  const w = document.createElement("div"); w.className = "win " + (side === "l" ? "win-l" : "win-r");
  const sky = document.createElement("span"); sky.className = "sky";
  [["18%",13,-2],["46%",19,-9],["70%",16,-5]].forEach(c => {
    const cl = document.createElement("span"); cl.className = "cloud";
    cl.style.cssText = "--y:"+c[0]+";--t:"+c[1]+"s;--dl:"+c[2]+"s"; sky.appendChild(cl);
  });
  const av = document.createElement("div"); av.className = "avatar"; av.textContent = emoji;
  const img = new Image(); img.alt = side === "l" ? "Him" : "Her";
  img.onload = () => w.classList.add("has");
  img.src = src;
  const bars = document.createElement("i"); bars.className = "bars";
  w.append(sky, av, img, bars);
  return w;
}
const split = $("split");
split.insertBefore(makeWindow("l", C.boyImage, "👦"), split.firstChild);
split.appendChild(makeWindow("r", C.girlImage, "👧"));

/* ---------- balloons ---------- */
const bwords = (C.balloonWords && C.balloonWords.length ? C.balloonWords : ["You","Are","So","Special"]).map(tc);
const bcols = ["#ff5d8f","#ffd85e","#7be0c3","#8f8bff"];
let popped = 0, ready = false, ac = null;
bwords.forEach((word, i) => {
  const sp = document.createElement("span"); sp.textContent = word; $("sentence").appendChild(sp);
  const b = document.createElement("button"); b.className = "bl"; b.style.setProperty("--i", i); b.style.setProperty("--c", bcols[i % 4]);
  b.setAttribute("aria-label", "Balloon " + (i+1));
  b.innerHTML = '<span class="bl-in"><span class="bl-body">'+(i+1)+'</span><span class="bl-knot"></span><span class="bl-str"></span></span>';
  b.onclick = e => { e.stopPropagation(); popBalloon(b, i); };
  $("balRow").appendChild(b);
});
function markNext(){ document.querySelectorAll(".bl").forEach((b,i) => b.classList.toggle("next", i === popped)); }
function popSound(){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const len = Math.floor(ac.sampleRate * .14), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
    const src = ac.createBufferSource(), g = ac.createGain(); g.gain.value = .5;
    src.buffer = buf; src.connect(g); g.connect(ac.destination); src.start();
  }catch(e){}
}
function burst(x, y, color){
  for(let k=0;k<14;k++){
    const s = document.createElement("i"); s.className = "spark"; const a = Math.PI*2*k/14, d = 50 + Math.random()*55;
    s.style.cssText = "left:"+x+"px;top:"+y+"px;background:"+color+";--dx:"+(Math.cos(a)*d)+"px;--dy:"+(Math.sin(a)*d)+"px";
    document.body.appendChild(s); setTimeout(() => s.remove(), 800);
  }
}
async function popBalloon(b, i){
  if(i !== popped){ b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
  popped++; markNext();
  const r = b.querySelector(".bl-body").getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, bcols[i % 4]);
  popSound();
  b.classList.add("popped");
  $("sentence").children[i].classList.add("show");
  if(popped === bwords.length){
    confetti(120);
    await wait(1400);
    reveal($("contHint"), tc(C.continueHint), {step:80});
    ready = true;
  }
}
$("s-balloons").addEventListener("click", () => { if(ready){ ready = false; startCake(); } });

/* ---------- candles ---------- */
for(let i=0;i<(C.candles||1);i++){
  const c = document.createElement("span"); c.className = "candle";
  c.innerHTML = '<span class="flame"></span><span class="smoke"></span><span class="smoke"></span><span class="smoke"></span>';
  $("candles").appendChild(c);
}

/* ---------- photos (placeholder if a file is missing) ---------- */
function placeholder(i){
  const col = ["#ffd85e","#7be0c3","#ff9bb8"][i%3];
  return "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="'+col+'"/>'+
    '<text x="200" y="210" font-size="90" text-anchor="middle">📷</text>'+
    '<text x="200" y="290" font-size="28" font-family="sans-serif" text-anchor="middle" fill="#1d1b4b">Your Photo '+(i+1)+'</text></svg>');
}
const car = $("carousel"), slides = [], dots = [];
let pos = 0, cur = 0, dragging = false;
C.photos.forEach((p,i) => {
  const f = document.createElement("figure"); f.className = "slide";
  const img = new Image(); img.alt = tc(p.caption || ("Photo " + (i+1))); img.draggable = false;
  img.onerror = () => { img.onerror = null; img.src = placeholder(i); };
  img.src = p.src;
  const cap = document.createElement("figcaption"); cap.textContent = tc(p.caption || "");
  f.appendChild(img); f.appendChild(cap); car.appendChild(f); slides.push(f);
  const d = document.createElement("button"); d.className = "dot"; d.setAttribute("aria-label", "Photo " + (i+1));
  d.onclick = () => goTo(i); $("dots").appendChild(d); dots.push(d);
});
$("swipeText").textContent = tc(C.swipeHint || "Swipe To See More");

function layout(){
  if(!slides.length) return;
  const W = slides[0].offsetWidth || 260;
  slides.forEach((s, i) => {
    const d = i - pos, a = Math.abs(d);
    const x = d * W * 0.66;
    const sc = Math.max(0.5, 1 - a * 0.2);
    const op = a < 1 ? 1 - a * 0.55 : Math.max(0, 0.45 - (a - 1) * 0.35);
    s.style.transform = "translate(-50%,-50%) translateX(" + x + "px) scale(" + sc + ") rotateY(" + (-d * 14) + "deg)";
    s.style.opacity = op;
    s.style.filter = a < 0.05 ? "none" : "blur(" + Math.min(a, 2) * 1.3 + "px) brightness(" + (1 - Math.min(a, 1) * 0.25) + ")";
    s.style.zIndex = 50 - Math.round(a * 10);
  });
  const near = Math.round(Math.max(0, Math.min(slides.length - 1, pos)));
  dots.forEach((d, i) => d.classList.toggle("on", i === near));
  $("prevBtn").disabled = near === 0; $("nextBtn").disabled = near === slides.length - 1;
}
function goTo(i){ cur = Math.max(0, Math.min(slides.length - 1, i)); pos = cur; layout(); }
$("prevBtn").onclick = () => { goTo(cur - 1); hideSwipe(); };
$("nextBtn").onclick = () => { goTo(cur + 1); hideSwipe(); };
function hideSwipe(){ $("swipeHint").classList.add("gone"); }

let sx = 0, sp = 0, moved = false, downSlide = -1;
car.addEventListener("pointerdown", e => {
  if(e.target.closest(".arrow")) return;
  dragging = true; moved = false; sx = e.clientX; sp = pos;
  const el = e.target.closest(".slide"); downSlide = el ? slides.indexOf(el) : -1;
  car.classList.add("dragging");
  try{ car.setPointerCapture(e.pointerId); }catch(err){}
});
car.addEventListener("pointermove", e => {
  if(!dragging) return;
  const dx = e.clientX - sx;
  if(Math.abs(dx) > 6) moved = true;
  const W = (slides[0].offsetWidth || 260) * 0.66;
  pos = Math.max(-0.35, Math.min(slides.length - 0.65, sp - dx / W));
  layout();
});
function endDrag(e){
  if(!dragging) return;
  dragging = false; car.classList.remove("dragging");
  const dx = e.clientX - sx;
  if(moved){
    hideSwipe();
    if(Math.abs(dx) > 40) goTo(cur + (dx < 0 ? 1 : -1)); else goTo(cur);
  } else if(downSlide > -1 && downSlide !== cur){
    hideSwipe(); goTo(downSlide);
  } else goTo(cur);
}
car.addEventListener("pointerup", endDrag);
car.addEventListener("pointercancel", endDrag);
addEventListener("keydown", e => {
  if(!$("o-gift").classList.contains("on")) return;
  if(e.key === "ArrowRight"){ goTo(cur + 1); hideSwipe(); }
  if(e.key === "ArrowLeft"){ goTo(cur - 1); hideSwipe(); }
});
addEventListener("resize", layout);
layout();

/* ---------- music (starts on the first tap) ---------- */
const song = $("song"), mbtn = $("music");
song.src = C.music; song.volume = (C.musicVolume == null ? 0.6 : C.musicVolume);
mbtn.onclick = () => { if(song.paused){ song.play().catch(()=>{}); mbtn.textContent="🔊"; } else { song.pause(); mbtn.textContent="🔈"; } };
document.addEventListener("pointerdown", () => { song.play().catch(()=>{}); mbtn.classList.add("show"); }, {once:true});

/* ---------- confetti ---------- */
const cv = $("fx"), ctx = cv.getContext("2d"); let parts = [], raf = null;
const dpr = Math.min(window.devicePixelRatio || 1, 2);
function size(){ cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; }
addEventListener("resize", size); size();
function confetti(n){
  const k = ["#ff5d8f","#ffd85e","#7be0c3","#ffffff","#8f8bff"];
  for(let i=0;i<n;i++) parts.push({x:Math.random()*cv.width, y:-Math.random()*cv.height*.4,
    w:(6+Math.random()*7)*dpr, h:(10+Math.random()*8)*dpr, vx:(Math.random()-.5)*3*dpr, vy:(2+Math.random()*4)*dpr,
    r:Math.random()*6, vr:(Math.random()-.5)*.3, c:k[i%k.length]});
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
  parts = parts.filter(p => p.y < cv.height+30);
  raf = parts.length ? requestAnimationFrame(loop) : null;
  if(!raf) ctx.clearRect(0,0,cv.width,cv.height);
}

/* =====================  FLOW  ===================== */

/* PAGE 1: intro */
(async function startIntro(){
  if(document.fonts && document.fonts.ready){ try{ await Promise.race([document.fonts.ready, wait(1200)]); }catch(e){} }
  await wait(200);
  go("s-intro");
  reveal($("introTitle"), tc(C.introTitle), {chars:true, step:30, delay:500});
  reveal($("askText"), tc(C.introQuestion), {step:90, delay:2000});
})();

/* The "No" button runs away 3 times, the 4th click asks "Are you sure?" */
let noCount = 0, lastPos = null;
function moveNo(){
  const b = $("noBtn"), slot = $("noSlot");
  if(!b.classList.contains("fly")){
    const r = b.getBoundingClientRect();
    slot.style.width = r.width + "px"; slot.style.height = r.height + "px";   // keep the layout from jumping
    document.body.appendChild(b);
    b.classList.add("fly"); b.style.left = r.left + "px"; b.style.top = r.top + "px";
    void b.offsetWidth;
  }
  const w = b.offsetWidth, h = b.offsetHeight, m = 14, topSafe = 70, botSafe = 70;
  const yes = $("yesBtn").getBoundingClientRect();
  let x = 0, y = 0;
  for(let t=0;t<30;t++){
    x = m + Math.random() * Math.max(1, innerWidth - w - 2*m);
    y = topSafe + Math.random() * Math.max(1, innerHeight - h - topSafe - botSafe);
    const hitsYes = x < yes.right + 12 && x + w > yes.left - 12 && y < yes.bottom + 12 && y + h > yes.top - 12;
    const tooClose = lastPos && Math.hypot(x - lastPos.x, y - lastPos.y) < 110;
    if(!hitsYes && !tooClose) break;
  }
  lastPos = {x, y}; b.style.left = x + "px"; b.style.top = y + "px";
}
$("noBtn").onclick = () => {
  noCount++;
  if(noCount <= 3) moveNo();
  else $("m-sure").classList.add("on");
};
$("yesBtn").onclick = () => toBalloons();
$("sureYes").onclick = () => { $("m-sure").classList.remove("on"); setTimeout(() => $("m-heart").classList.add("on"), 350); };
$("sureNo").onclick = () => { $("m-sure").classList.remove("on"); toBalloons(); };
$("heartYes").onclick = () => { $("m-heart").classList.remove("on"); toBalloons(); };

/* PAGE 2: balloons */
async function toBalloons(){
  $("noBtn").classList.add("gone");
  go("s-balloons");
  reveal($("balloonHint"), tc(C.balloonHint), {step:90, delay:500});
  await wait(1800); markNext();
}

/* PAGE 3: cake */
async function startCake(){
  go("s-cake");
  await wait(300);
  const t = reveal($("wishText"), tc(C.wishText), {chars:true, step:38, delay:300});
  reveal($("hint"), tc(C.tapHint), {step:70, delay:t});
}
let blown = false;
$("candleBtn").onclick = async () => {
  if(blown) return; blown = true;
  const cake = $("cake");
  cake.classList.add("blowing");
  await wait(450);
  cake.classList.add("out");
  reveal($("hint"), tc(C.afterBlowText), {step:90});
  await wait(700);
  confetti(200);
  await wait(2300);
  go("s-pick");
  const t = reveal($("pickTitle"), tc(C.pickTitle), {step:110, delay:500});
  reveal($("pickHint"), tc(C.pickHint), {step:90, delay:t});
  reveal($("cardLabel"), tc(C.cardLabel), {step:60, delay:1500});
  reveal($("giftLabel"), tc(C.giftLabel), {step:60, delay:1800});
};

/* PAGE 4: card or gift */
let seenCard = false, seenGift = false;
async function closeAll(){
  document.querySelectorAll(".overlay").forEach(o => o.classList.remove("on"));
  await wait(800); $("gift").classList.remove("opened");
  if(seenCard && seenGift) $("goNext").classList.add("show");
}
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeAll);
addEventListener("keydown", e => { if(e.key === "Escape") closeAll(); });

$("cardBtn").onclick = () => {
  seenCard = true; $("cardBtn").classList.add("done");
  $("o-card").classList.add("on");
  const t0 = reveal($("letterHead"), tc(C.letterHeading), {step:90, delay:600});
  const t1 = reveal($("cardTitle"), tc(C.cardTitle), {step:110, delay:t0 - 300});
  const t2 = reveal($("cardMsg"), C.cardMessage, {step:32, delay:t1 - 300});
  reveal($("cardSig"), tc(C.cardSignature), {step:100, delay:t2 - 300});
  setTimeout(() => confetti(50), 600);
};
$("giftBtn").onclick = async () => {
  seenGift = true; $("giftBtn").classList.add("done");
  $("gift").classList.add("opened");
  await wait(1100);
  goTo(0); $("swipeHint").classList.remove("gone");
  $("o-gift").classList.add("on");
  reveal($("collageTitle"), tc(C.collageTitle), {chars:true, step:45, delay:300});
  confetti(120);
};

/* PAGE 5: final page */
$("goNext").textContent = tc(C.nextLabel);
const stickerImg = $("stickerImg");
stickerImg.onload = () => $("stickerCard").classList.add("has");
stickerImg.src = C.finalImage;
function heartsPop(x, y, n){
  for(let i=0;i<n;i++){
    const h = document.createElement("span"); h.className = "hpop"; h.textContent = "♥";
    const a = -Math.PI/2 + (Math.random()-.5)*2.2, d = 60 + Math.random()*80;
    h.style.cssText = "left:"+x+"px;top:"+y+"px;font-size:"+(14+Math.random()*14)+"px;--dx:"+(Math.cos(a)*d)+"px;--dy:"+(Math.sin(a)*d)+"px";
    document.body.appendChild(h); setTimeout(() => h.remove(), 1200);
  }
}
$("heartBadge").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); heartsPop(r.left + r.width/2, r.top + r.height/2, 12); };
let rain = null;
function startRain(){
  if(rain) return;
  rain = setInterval(() => {
    if(!$("s-final").classList.contains("on")) return;
    const h = document.createElement("span"); h.className = "hrt"; h.textContent = "♥";
    h.style.cssText = "left:"+(Math.random()*100)+"%;font-size:"+(12+Math.random()*16)+"px;--t:"+(6+Math.random()*4)+"s;--dx:"+((Math.random()-.5)*60)+"px";
    document.body.appendChild(h); setTimeout(() => h.remove(), 10500);
  }, 700);
}
$("goNext").onclick = async () => {
  $("goNext").classList.remove("show");
  go("s-final");
  reveal($("finalLine1"), tc(C.finalLine1), {step:110, delay:1100});
  reveal($("finalLine2"), tc(C.finalLine2), {step:90, delay:2000});
  startRain();
  await wait(900);
  const r = $("heartBadge").getBoundingClientRect(); heartsPop(r.left + r.width/2, r.top + r.height/2, 10);
};
</script>
